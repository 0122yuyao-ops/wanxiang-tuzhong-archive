name: Sync Wanxiang archive
on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published read-only archive
        run: |
          set -euo pipefail
          base='https://wanxiang-tuzhong.mauvechime18.chatgpt.site'
          for name in latest stories world; do
            curl --fail --location --retry 3 --silent --show-error "$base/$name.json" -o "$name.json.new"
          done
      - name: Verify stories, sources and version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = n => JSON.parse(fs.readFileSync(n + '.json.new', 'utf8'));
          const latest = read('latest'), stories = read('stories'), world = read('world');
          const arr = stories.stories;
          if (!Array.isArray(arr) || !arr.length || !Array.isArray(world.world) || !world.world.length) throw Error('Archive is incomplete');
          if (latest.storyCount !== arr.length || latest.latestStory.realDate !== arr.at(-1).realDate) throw Error('Latest story mismatch');
          if (new Set([latest.archiveVersion, stories.archiveVersion, world.archiveVersion]).size !== 1) throw Error('Archive versions differ');
          if (arr.some(s => !s.originalText?.trim() || !s.realDate || !(s.messageId || (s.conversationId && s.runId)))) throw Error('Story text or provenance missing');
          if (new Set(arr.map(s => s.realDate)).size !== arr.length) throw Error('Duplicate story dates');
          for (let i = 1; i < arr.length; i++) if (Date.parse(arr[i].realDate) - Date.parse(arr[i-1].realDate) !== 86400000) throw Error('Story date gap');
          if (fs.existsSync('stories.json')) {
            const previous = JSON.parse(fs.readFileSync('stories.json', 'utf8')).stories;
            if (arr.length < previous.length) throw Error('Published archive lost stories');
            for (let i = 0; i < previous.length; i++) if (arr[i].originalText !== previous[i].originalText) throw Error('Archived original changed');
          }
          for (const n of ['latest','stories','world']) fs.renameSync(n + '.json.new', n + '.json');
          NODE
      - name: Commit only verified changes
        run: |
          if git diff --quiet -- latest.json stories.json world.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json stories.json world.json
          git commit -m 'Sync verified published archive'
          git push
